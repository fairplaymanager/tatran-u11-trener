<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ballShade" cx="34%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"></stop>
      <stop offset="55%" stop-color="#e6e6e0" stop-opacity="1"></stop>
      <stop offset="100%" stop-color="#7a7a72" stop-opacity="1"></stop>
    </radialGradient>
    <radialGradient id="ballEdgeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"></stop>
    </radialGradient>
    
    <linearGradient id="gradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5A28" stop-opacity="0.97"></stop>
      <stop offset="55%" stop-color="#16742F" stop-opacity="0.88"></stop>
      <stop offset="100%" stop-color="#1F8B3F" stop-opacity="0.82"></stop>
    </linearGradient>
    <linearGradient id="gradT_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5A28"></stop>
      <stop offset="55%" stop-color="#16742F"></stop>
      <stop offset="100%" stop-color="#1F8B3F"></stop>
    </linearGradient>
    <radialGradient id="topGloss" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"></stop>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="bottomShade" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.26"></stop>
      <stop offset="55%" stop-color="#000" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"></feGaussianBlur>
      <feOffset dx="0" dy="4" result="offsetblur"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"></feFuncA></feComponentTransfer>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <g id="football">
      <circle cx="0" cy="0" r="500" fill="url(#ballShade)"></circle>
      <g fill="#1a1a1a" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round">
        <polygon points="0,-130 124,-40 76,108 -76,108 -124,-40"></polygon>
        <g transform="rotate(0)   translate(0,-300)"><polygon points="0,-90 86,-28 53,75 -53,75 -86,-28"></polygon></g>
        <g transform="rotate(72)  translate(0,-300)"><polygon points="0,-90 86,-28 53,75 -53,75 -86,-28"></polygon></g>
        <g transform="rotate(144) translate(0,-300)"><polygon points="0,-90 86,-28 53,75 -53,75 -86,-28"></polygon></g>
        <g transform="rotate(216) translate(0,-300)"><polygon points="0,-90 86,-28 53,75 -53,75 -86,-28"></polygon></g>
        <g transform="rotate(288) translate(0,-300)"><polygon points="0,-90 86,-28 53,75 -53,75 -86,-28"></polygon></g>
      </g>
      <g fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
        <line x1="0" y1="-130" x2="0" y2="-210"></line>
        <line x1="124" y1="-40" x2="200" y2="-65"></line>
        <line x1="76" y1="108" x2="124" y2="170"></line>
        <line x1="-76" y1="108" x2="-124" y2="170"></line>
        <line x1="-124" y1="-40" x2="-200" y2="-65"></line>
        <g transform="rotate(36)"><line x1="0" y1="-380" x2="0" y2="-460"></line></g>
        <g transform="rotate(108)"><line x1="0" y1="-380" x2="0" y2="-460"></line></g>
        <g transform="rotate(180)"><line x1="0" y1="-380" x2="0" y2="-460"></line></g>
        <g transform="rotate(252)"><line x1="0" y1="-380" x2="0" y2="-460"></line></g>
        <g transform="rotate(324)"><line x1="0" y1="-380" x2="0" y2="-460"></line></g>
        <path d="M 0,-380 Q 180,-300 285,-160"></path>
        <path d="M 285,-160 Q 260,40 130,170"></path>
        <path d="M 130,170 Q -10,250 -130,170"></path>
        <path d="M -130,170 Q -260,40 -285,-160"></path>
        <path d="M -285,-160 Q -180,-300 0,-380"></path>
      </g>
      <circle cx="0" cy="0" r="500" fill="url(#ballEdgeShadow)"></circle>
      <ellipse cx="-170" cy="-220" rx="170" ry="80" fill="#ffffff" opacity="0.18" transform="rotate(-30 -170 -220)"></ellipse>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#gradT_bg)"></rect>
  <g transform="translate(512 520) scale(1.02)">
    <use href="#football"></use>
  </g>
  <rect width="1024" height="1024" fill="url(#gradT)"></rect>
  <rect width="1024" height="1024" fill="url(#topGloss)"></rect>
  <rect width="1024" height="1024" fill="url(#bottomShade)"></rect>

  <g filter="url(#textShadow)" fill="#ffffff" font-family="&#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif">
    <text x="512" y="415" text-anchor="middle" font-size="108" font-weight="800" letter-spacing="14" opacity="0.94">U11</text>
    <text x="512" y="685" text-anchor="middle" font-size="210" font-weight="900" letter-spacing="2">TRÉNER</text>
  </g>
</svg>