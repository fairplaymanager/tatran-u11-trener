<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tréner U11</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=6">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png?v=6">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=6">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=6">
<meta name="apple-mobile-web-app-title" content="Tréner U11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F8B3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Pozn.: ŽIADNY manifest. start_url v manifeste by iOS použil pri spustení
     z plochy a zahodil by ?token=… Token držíme cez URL + localStorage.
     Standalone rieši apple-mobile-web-app-capable (manifest netreba). -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;min-height:100%}
  body{background:linear-gradient(150deg,#134E27,#1A7236 32%,#1F8B3F 66%,#2B9C49);
    color:#fff;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 22px;min-height:100vh}
  img.ic{width:108px;height:108px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.3);margin-bottom:18px}
  h1{font-size:26px;font-weight:800;margin:0 0 4px}
  p.sub{font-size:15px;opacity:.9;margin:0 0 26px}
  a.btn,button.btn{display:inline-block;background:#fff;color:#0F5A28;font-weight:700;font-size:18px;
    text-decoration:none;padding:15px 30px;border-radius:14px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
  a.btn.off{opacity:.45;pointer-events:none}
  .hint{margin-top:30px;font-size:13px;opacity:.82;line-height:1.5;max-width:340px}
  .warn{background:rgba(0,0,0,.22);border-radius:12px;padding:14px 16px}
  .tokbox{margin-top:8px;display:flex;gap:8px;flex-direction:column;align-items:center}
  .tokbox input{font-size:16px;padding:12px 14px;border-radius:12px;border:0;width:260px;text-align:center;letter-spacing:1px}
  .hidden{display:none}

  /* [PoC iframe-embed] Standalone shell — top-level zostáva github.io (zachová
     standalone bez Safari chrome), trénerská appka sa renderuje vo fullscreen iframe
     (token cez iframe.src). Safe-area padding → obsah nelezie pod notch/home indicator. */
  #appwrap{position:fixed;inset:0;z-index:1000;display:none;background:#1F8B3F;overflow:hidden;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  /* [2026-06-11] spodná safe-area (pod home-indicatorom) = ZELENÁ (#1F8B3F, ladí so zeleným topbarom). height = safe-area + 16px → strip vystúpi cez spodný okraj iframe (::after sa maľuje nad iframe) a zakryje biele odsadenie tabbara (tab-btn justify-center ~14.5px + padding 18px) → zelený dosiahne spodok labelu (uppercase = ~2px prázdneho priestoru pod glyfmi v box-e, využité). +16px = PRAKTICKÉ MAXIMUM bez orezania textu labelov (nad to by si vyžadovalo prestavbu #tabbar v GAS — posun labelov hore / nižší tabbar). Fero preferencia (iterácia 8→14→16px). */
  #appwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 16px);background:#1F8B3F;pointer-events:none}
  /* width/height/transform nastavuje JS (fit) — iframe renderuje na DW px a škáluje
     sa na displej, čím replikuje pôvodné GAS prostredie (html.m kalibrácia). */
  #appframe{display:block;border:0;background:#fff}
  #splash{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#fff;font-family:'Sora',-apple-system,sans-serif;
    transition:opacity .3s;pointer-events:none;
    background:
      radial-gradient(110% 75% at 16% 3%, rgba(0,0,0,.24), rgba(0,0,0,0) 44%),
      radial-gradient(110% 75% at 84% 99%, rgba(0,0,0,.22), rgba(0,0,0,0) 44%),
      radial-gradient(120% 90% at 50% 48%, rgba(255,255,255,.06), rgba(255,255,255,0) 55%),
      linear-gradient(168deg,#134E27 0%,#1A7236 30%,#1F8B3F 58%,#2B9C49 100%)}
  #splash.hide{opacity:0}
  #splash #spmark{width:84px;height:84px;display:block;transform:translateY(-2vh)}
  #splash .wmv{display:flex;flex-direction:column;align-items:center;line-height:1;margin-top:20px}
  #splash .wmv-row{display:flex;font-weight:800;letter-spacing:-.025em;font-size:36px}
  #splash .wmv .fair{color:#fff}#splash .wmv .play{color:#F7B53B}
  #splash .wmv-sub{font-weight:600;letter-spacing:.4em;color:rgba(255,255,255,.66);font-size:11px;padding-left:.4em;margin-top:8px}
  #splash .tagline{color:rgba(255,255,255,.78);font-weight:400;font-size:12.5px;margin-top:17px}
  html.embed,body.embed{overflow:hidden}
</style>
<script>
  // Token-passthrough + zapamätanie. Token sa NIKDY neukladá v repe — len v URL
  // tohto launchera a v localStorage zariadenia (per-tréner, na origine launchera).
  var BASE = "https://script.google.com/macros/s/AKfycbwtY15tDDfX4dz4hZm6WrcuabCfweVtyr3RiCv65wQD1e9Cy99SkR86EOz3U1t5ogm3/exec?view=trener";
  var LS_KEY = "u11_trener_token";
  function getTokFromUrl(){ var m = location.search.match(/[?&]token=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; }
  var TOKEN = getTokFromUrl();
  try {
    if (TOKEN) { localStorage.setItem(LS_KEY, TOKEN); }      // ulož pri prvom otvorení s tokenom
    else { TOKEN = localStorage.getItem(LS_KEY) || ""; }      // inak skús zapamätaný
  } catch (e) {}
  var TARGET = TOKEN ? (BASE + "&token=" + encodeURIComponent(TOKEN)) : BASE;
  var STANDALONE = (window.navigator.standalone === true);
  // [PoC] Spustené z plochy a token máme → NErobíme cross-origin redirect (ten by
  // vyhodil appku do Safari s chrome). Namiesto toho appku vložíme do fullscreen
  // iframe; top-level zostane na github.io → standalone bez pásov. Token ide cez src.
  // Standalone bez tokenu / bežné Safari → landing page nižšie (button / token input).
  if (STANDALONE && TOKEN) {
    document.documentElement.className += " embed";
    document.addEventListener("DOMContentLoaded", function(){
      document.body.className += " embed";
      var wrap = document.getElementById("appwrap");
      var frame = document.getElementById("appframe");
      var splash = document.getElementById("splash");
      if (!wrap || !frame) return;
      wrap.style.display = "block";
      // [PoC fix] iframe renderuje na DW=980 (default Safari layout width, pre ktorý
      // je trénerské html.m kalibrované) a CSS transformom ho zmenšíme na šírku
      // displeja — replikuje pôvodné GAS-in-Safari prostredie (žiadny pretok do strán).
      var DW = 980;
      function fit(){
        // [bottom-nav fix] CONTENT-box rozmery — clientWidth/clientHeight zahŕňajú
        // safe-area padding shell-u; bez odčítania scaled iframe pretečie
        // overflow:hidden a fixed-bottom #tabbar sa oreže. Padding čítame z computed
        // style (parseFloat), NEHARDCODUJEME env() hodnoty.
        var cs = getComputedStyle(wrap);
        var padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
        var padT = parseFloat(cs.paddingTop) || 0, padB = parseFloat(cs.paddingBottom) || 0;
        var w = wrap.clientWidth - padL - padR, h = wrap.clientHeight - padT - padB;
        if (!w || !h) return;
        var s = w / DW;
        frame.style.width = DW + "px";
        frame.style.height = (h / s) + "px";
        frame.style.transformOrigin = "0 0";
        frame.style.transform = "scale(" + s + ")";
      }
      fit();
      // [bottom-nav robust] re-fit na settle-pointoch: env(safe-area-inset-*) (a tým
      // content-box clientHeight) sa pri standalone cold-launchi nemusí resolvnúť hneď
      // na DOMContentLoaded → jednorazový fit by chytil padding=0, iframe by ostal
      // nadrozmerný a fixed #tabbar orezaný (žiadny ďalší re-fit by neprišiel). fit() je
      // idempotentné, takže opakované volanie len dorovná správnu geometriu.
      setTimeout(fit, 250);
      setTimeout(fit, 700);
      window.addEventListener("load", fit);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", function(){ setTimeout(fit, 250); });
      frame.addEventListener("load", function(){ if (splash) splash.className = "hide"; if (window.__spi) clearInterval(window.__spi); fit(); });
      // [v22.146] cache-bust trener app (client) → vždy čerstvá verzia po deployi
      frame.src = TARGET + "&_cb=" + Date.now();
    });
  }
</script>
</head>
<body>
  <!-- Standalone + token: fullscreen iframe shell (skrytý kým JS nezistí standalone) -->
  <div id="appwrap">
    <div id="splash">
      <svg id="spmark" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div class="wmv"><div class="wmv-row"><span class="fair">Fair</span><span class="play">Play</span></div><div class="wmv-sub">MANAGER</div></div>
      <div class="tagline">Férové minúty pre každého</div>
    </div>
    <iframe id="appframe" title="U11 — Tréner" allow="clipboard-write; web-share"></iframe>
  </div>

  <!-- Bežné Safari / standalone bez tokenu: landing page -->
  <img class="ic" src="apple-touch-icon.png?v=6" alt="U11 Tréner">
  <h1>U11 — Tréner</h1>
  <p class="sub">Správa nominácií · FC Tatran Prešov</p>

  <a class="btn" id="openBtn" href="#">Otvoriť →</a>

  <div class="hint" id="hint">📲 Pridaj na plochu: ťukni <b>Zdieľať</b> → <b>Pridať na plochu</b>.</div>

  <!-- Záložné vloženie tokenu (ak by chýbal v URL aj v pamäti) -->
  <div class="hint warn hidden" id="tokWarn">
    Zadaj svoj <b>prístupový token</b> (nájdeš ho v trénerskej appke → ⚙️ Nastavenia). Zapamätá sa na tomto zariadení.
    <div class="tokbox">
      <input id="tokInput" placeholder="napr. 2DFF2D3FE37B" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="btn" id="tokSave">Uložiť a otvoriť →</button>
    </div>
  </div>

  <script>
    document.getElementById('openBtn').href = TARGET;
    if (!TOKEN) {
      // Token chýba (URL aj pamäť) → skry „Otvoriť", ukáž vkladacie pole.
      document.getElementById('openBtn').className = 'btn off';
      document.getElementById('hint').classList.add('hidden');
      document.getElementById('tokWarn').classList.remove('hidden');
      document.getElementById('tokSave').addEventListener('click', function(){
        var t = (document.getElementById('tokInput').value || '').trim();
        if (!t) return;
        try { localStorage.setItem(LS_KEY, t); } catch(e){}
        location.replace(BASE + "&token=" + encodeURIComponent(t));
      });
    }
  </script>

  <script>
    /* Splash loader = Fair-ring marka (port z marks3.jsx). Oranžový segment obieha,
       trojuholník statický, pokoj vľavo hore (idx 5). Reduced-motion = statická. */
    (function(){
      var mk=document.getElementById('spmark'); if(!mk) return;
      function pol(cx,cy,r,d){var a=(d-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
      function seg(cx,cy,ro,ri,a0,a1){var A=pol(cx,cy,ro,a0),B=pol(cx,cy,ro,a1),C=pol(cx,cy,ri,a1),D=pol(cx,cy,ri,a0),L=(a1-a0)<=180?0:1;
        return 'M'+A[0].toFixed(2)+' '+A[1].toFixed(2)+' A'+ro+' '+ro+' 0 '+L+' 1 '+B[0].toFixed(2)+' '+B[1].toFixed(2)+' L'+C[0].toFixed(2)+' '+C[1].toFixed(2)+' A'+ri+' '+ri+' 0 '+L+' 0 '+D[0].toFixed(2)+' '+D[1].toFixed(2)+' Z';}
      var NS='http://www.w3.org/2000/svg',c=50,ro=42,gap=7,st=60,ri=31,REST=5,RING='#FFFFFF',ACC='#F59E0B',S=[];
      for(var i=0;i<6;i++){var a0=i*st-st/2+gap/2,a1=i*st+st/2-gap/2,p=document.createElementNS(NS,'path');p.setAttribute('d',seg(c,c,ro,ri,a0,a1));S.push(p);mk.appendChild(p);}
      var tr=document.createElementNS(NS,'polygon');tr.setAttribute('points','64,50 42.5,37.5 42.5,62.5');tr.setAttribute('fill',ACC);tr.setAttribute('stroke',ACC);tr.setAttribute('stroke-width','5.5');tr.setAttribute('stroke-linejoin','round');tr.setAttribute('stroke-linecap','round');mk.appendChild(tr);
      function paint(k){for(var i=0;i<6;i++)S[i].setAttribute('fill',i===k?ACC:RING);}
      paint(REST);
      var red=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(!red){var k=REST;window.__spi=setInterval(function(){k=(k+1)%6;paint(k);},165);}
    })();
  </script>
</body>
</html>
