<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tréner U11</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Tréner U11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F8B3F">
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:linear-gradient(160deg,#0F5A28,#1F8B3F 55%,#23A14B);
    color:#fff;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 22px;min-height:100vh}
  img.ic{width:108px;height:108px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.3);margin-bottom:18px}
  h1{font-size:26px;font-weight:800;margin:0 0 4px}
  p.sub{font-size:15px;opacity:.9;margin:0 0 26px}
  a.btn{display:inline-block;background:#fff;color:#0F5A28;font-weight:700;font-size:18px;
    text-decoration:none;padding:15px 30px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  a.btn.off{opacity:.45;pointer-events:none}
  .hint{margin-top:30px;font-size:13px;opacity:.82;line-height:1.5;max-width:340px}
  .warn{background:rgba(0,0,0,.22);border-radius:12px;padding:12px 14px}
</style>
<script>
  // Token-passthrough: token sa NIKDY neukladá v tomto repe. Číta sa z URL
  // tohto launchera (…/?token=XXX) a pridá sa do GAS odkazu. Token žije len
  // v osobnej domovskej záložke trénera.
  var BASE = "https://script.google.com/macros/s/AKfycbwtY15tDDfX4dz4hZm6WrcuabCfweVtyr3RiCv65wQD1e9Cy99SkR86EOz3U1t5ogm3/exec?view=trener";
  function getTok(){ var m = location.search.match(/[?&]token=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; }
  var TOKEN = getTok();
  var TARGET = TOKEN ? (BASE + "&token=" + encodeURIComponent(TOKEN)) : BASE;
  // Standalone (spustené z plochy) → rovno otvor trénerskú webapp.
  if (window.navigator.standalone === true && TOKEN) { location.replace(TARGET); }
</script>
</head>
<body>
  <img class="ic" src="apple-touch-icon.png?v=1" alt="U11 Tréner">
  <h1>U11 — Tréner</h1>
  <p class="sub">Správa nominácií · FC Tatran Prešov</p>
  <a class="btn" id="openBtn" href="#">Otvoriť →</a>
  <div class="hint" id="hint">📲 Pridaj na plochu: ťukni <b>Zdieľať</b> → <b>Pridať na plochu</b>.</div>
  <script>
    document.getElementById('openBtn').href = TARGET;
    if (!TOKEN) {
      document.getElementById('openBtn').className = 'btn off';
      document.getElementById('hint').className = 'hint warn';
      document.getElementById('hint').innerHTML =
        '⚠️ V adrese chýba <b>token</b>. Použi odkaz v tvare<br><b>…/?token=TVOJTOKEN</b><br>(token nájdeš v trénerskej appke → ⚙️ Nastavenia).';
    }
  </script>
</body>
</html>
